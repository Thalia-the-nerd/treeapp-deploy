<!doctype html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4704544852112670"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email - TreePlace.App</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3x/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1><a href="index.html">TreePlace.App</a></h1>
        <nav id="main-nav">
          <ul>
            <li><a href="index.html" class="btn">Home</a></li>
            <li><a href="sponsors.html" class="btn">Sponsors</a></li>
            <li><a href="login.html" class="btn">Login</a></li>
            <li>
              <a
                href="https://www.patreon.com/c/treeplace/membership"
                class="btn"
                >Donate</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="auth-container">
          <h2>Verify Your Email</h2>
          <p>
            A verification code has been sent to your email. Please enter it
            below.
          </p>
          <form id="verify-form">
            <div class="form-group">
              <label for="verification-code">Verification Code</label>
              <input
                type="text"
                id="verification-code"
                name="verification-code"
                required
              />
            </div>
            <button type="submit" class="btn primary">Verify</button>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Treeplace.app All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Calendar - TreePlace.App</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3x/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1><a href="index.html">TreePlace.App</a></h1>
        <nav id="main-nav">
          <ul>
            <li><a href="index.html" class="btn">Home</a></li>
            <li><a href="sponsors.html" class="btn">Sponsors</a></li>
            <li><a href="login.html" class="btn">Login</a></li>
            <li><a href="https://www.patreon.com/c/treeplace/membership" class="btn">Donate</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <section id="calendar-hero" class="section" style="padding-top: 100px;">
      <div class="container">
        <h2 class="animate-text">Event Calendar</h2>
        <p class="animate-text">
          Join us for our upcoming tree planting events and help us make Miami greener.
        </p>
      </div>
    </section>

    <section id="calendar" class="section">
        <div class="container">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev-month" class="btn secondary"><i class="fas fa-chevron-left"></i></button>
                    <h3 id="month-year"></h3>
                    <button id="next-month" class="btn secondary"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Calendar days will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Treeplace.app All rights reserved.</p>
      </div>
    </footer>
    <script src="calendar.js"></script>
  </body>
</html>

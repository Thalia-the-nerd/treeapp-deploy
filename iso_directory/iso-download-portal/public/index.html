<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO Download Portal</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Linux ISO Download Portal</h1>
        <div class="filter-container">
            <input type="text" id="search-bar" placeholder="Search for a distribution...">
        </div>
    </header>
    <main id="grid-container"></main>
    <script>
        const container = document.getElementById('grid-container');
        const searchBar = document.getElementById('search-bar');
        let allDistros = [];

        const formatBytes = (bytes, decimals = 2) => {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        };

        const renderDistros = (distros) => {
            container.innerHTML = '';
            distros.forEach(distro => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let versionsHtml = distro.versions.map(v => `
                    <div class="version">
                        <h4>${v.name}</h4>
                        ${v.filename ? `
                            <p><strong>Version:</strong> ${v.version || 'N/A'}</p>
                            <p><strong>File Size:</strong> ${formatBytes(v.size)}</p>
                            <p class="checksum"><strong>SHA256:</strong> <span>${v.checksum || 'N/A'}</span></p>
                            <p><strong>Downloads:</strong> ${v.downloads || 0}</p>
                            <div class="download-links">
                                <a href="/api/download/${v.id}" class="download-btn">HTTP</a>
                                ${v.torrent ? `<a href="/torrents/${v.filename}.torrent" class="download-btn torrent">Torrent</a>` : ''}
                            </div>
                        ` : '<p>ISO not available.</p>'}
                    </div>
                `).join('');

                card.innerHTML = `
                    <img src="${distro.logo}" alt="${distro.name} Logo" class="logo">
                    <h2>${distro.name}</h2>
                    <div class="versions-container">${versionsHtml}</div>
                `;
                container.appendChild(card);
            });
        };

        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allDistros.filter(d => d.name.toLowerCase().includes(searchTerm));
            renderDistros(filtered);
        });

        fetch('/api/status')
            .then(res => res.json())
            .then(distros => {
                allDistros = distros;
                renderDistros(allDistros);
            });
    </script>
</body>
</html>

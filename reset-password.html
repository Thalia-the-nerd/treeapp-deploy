<!doctype html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4704544852112670"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - TreePlace.App</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3x/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1><a href="index.html">TreePlace.App</a></h1>
        <nav id="main-nav">
          <ul>
            <li><a href="index.html" class="btn">Home</a></li>
            <li><a href="sponsors.html" class="btn">Sponsors</a></li>
            <li><a href="login.html" class="btn">Login</a></li>
            <li>
              <a
                href="https://www.patreon.com/c/treeplace/membership"
                class="btn"
                >Donate</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="auth-container">
          <h2>Reset Your Password</h2>
          <form id="reset-password-form">
            <input type="hidden" id="token" name="token" />
            <div class="form-group">
              <label for="password">New Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm New Password</label>
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                required
              />
            </div>
            <button type="submit" class="btn primary">Reset Password</button>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Treeplace.app All rights reserved.</p>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        if (token) {
          document.getElementById("token").value = token;
        }
      });
    </script>
  </body>
</html>

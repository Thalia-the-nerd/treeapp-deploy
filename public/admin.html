<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4704544852112670"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TreePlace.App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h1><a href="admin.html" style="color: #ecf0f1; text-decoration: none;">TreePlace.App</a></h1>
            </div>
            <nav class="sidebar-nav">
                <a href="#users" class="nav-link active"><i class="fas fa-users"></i> <span>Users</span></a>
                <a href="#events" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>Events</span></a>
                <a href="#sponsors" class="nav-link"><i class="fas fa-hand-holding-heart"></i> <span>Sponsors</span></a>
                <a href="#notifications" class="nav-link"><i class="fas fa-bell"></i> <span>Notifications</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-button"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </div>
        </aside>
        <main class="admin-main-content">
            <header class="admin-header">
                <div class="header-left">
                    <h2 id="page-title">User Management</h2>
                </div>
                <div class="header-right">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="user-search-input" placeholder="Search...">
                    </div>
                    <span>Admin</span>
                </div>
            </header>

            <section id="users" class="admin-section active">
                <div class="admin-card full-width">
                    <div class="card-header">
                        <h3>All Users</h3>
                        <button id="add-user-btn" class="btn primary"><i class="fas fa-plus"></i> Add User</button>
                    </div>
                    <div id="users-table-container">
                        <!-- Users table will be loaded here by JavaScript -->
                    </div>
                </div>
            </section>

            <section id="events" class="admin-section">
                <div class="admin-card">
                    <h3>Create New Event</h3>
                    <form id="create-event-form" class="admin-form">
                        <div class="form-group">
                            <label for="eventName">Event Name</label>
                            <input type="text" id="eventName" required>
                        </div>
                        <div class="form-group">
                            <label for="eventDate">Event Date</label>
                            <input type="datetime-local" id="eventDate" required>
                        </div>
                        <div class="form-group">
                            <label for="eventLocation">Event Location</label>
                            <input type="text" id="eventLocation" required>
                        </div>
                        <div id="map" style="height: 300px; width: 100%; margin-top: 1rem; border-radius: var(--border-radius-md);"></div>
                        <button type="submit" class="btn primary full-width">Create Event</button>
                    </form>
                </div>
                <div class="admin-card">
                    <h3>Current Events</h3>
                    <div id="events-table-container">
                        <!-- Events table will be loaded here by JavaScript -->
                    </div>
                </div>
            </section>

            <section id="notifications" class="admin-section">
                <div class="admin-card full-width">
                    <h3>Notifications Feed</h3>
                    <div id="notifications-list">
                        <!-- Notifications will be loaded here by JavaScript -->
                    </div>
                </div>
            </section>

            <section id="sponsors" class="admin-section">
                <div class="admin-card">
                    <h3>Add New Sponsor</h3>
                    <form id="add-sponsor-form" class="admin-form">
                        <div class="form-group">
                            <label for="sponsorName">Sponsor Name</label>
                            <input type="text" id="sponsorName" required>
                        </div>
                        <div class="form-group">
                            <label for="sponsorLevel">Sponsorship Level</label>
                            <input type="text" id="sponsorLevel" required>
                        </div>
                        <div class="form-group">
                            <label for="sponsorLogo">Logo URL</label>
                            <input type="text" id="sponsorLogo">
                        </div>
                        <button type="submit" class="btn primary full-width">Add Sponsor</button>
                    </form>
                </div>
                <div class="admin-card">
                    <h3>Current Sponsors</h3>
                    <div id="sponsors-table-container">
                        <!-- Sponsors table will be loaded here by JavaScript -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="edit-user-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Edit User</h2>
            <form id="edit-user-form" class="admin-form">
                <input type="hidden" id="edit-userId">
                <div class="form-group">
                    <label for="edit-username">Username</label>
                    <input type="text" id="edit-username" disabled>
                </div>
                <div class="form-group">
                    <label for="edit-moneyDonated">Money Donated</label>
                    <input type="number" id="edit-moneyDonated" step="0.01">
                </div>
                <div class="form-group">
                    <label for="edit-timeDonated">Time Donated (hours)</label>
                    <input type="number" id="edit-timeDonated" step="0.1">
                </div>
                <div class="form-group">
                    <label class="checkbox-container"> Is Admin?
                        <input type="checkbox" id="edit-isAdmin">
                        <span class="checkmark"></span>
                    </label>
                </div>
                <button type="submit" class="btn primary">Save Changes</button>
            </form>
        </div>
    </div>

    <div id="qr-code-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Event QR Code</h2>
            <div id="qr-code-container"></div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        function initMap() {
            // Placeholder for map initialization
            console.log("Google Maps API loaded.");
        }
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap"></script>
</body>
</html>

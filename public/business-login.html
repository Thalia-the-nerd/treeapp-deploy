    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Login - TreePlace.App</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3x/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
    <div class="container">
        <div class="logo">
            <h1><a href="https://treeplace.app">TreePlace.App</a></h1>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="index.html" data-translate="home">Home</a></li>
                <li><a href="sponsors.html" data-translate="sponsors">Sponsors</a></li>
                <li><a href="calendar.html" data-translate="calendar">Calendar</a></li>
                <li><a href="partners.html" data-translate="partners">Partners</a></li>
                <li><a href="login.html" data-translate="login">Login</a></li>
                <li><a href="https://www.patreon.com/c/treeplace/membership" class="btn primary" data-translate="donate">Donate</a></li>
            </ul>
        </nav>
        <div class="header-controls">
            <button id="dark-mode-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <button id="hamburger-menu" class="hamburger-menu" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>
</header>

    <section class="section">
      <div class="container">
        <div class="auth-container">
          <h2>Business Login</h2>
          <form id="business-login-form">
            <div class="form-group">
              <label for="username">Business Username or Email</label>
              <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <button type="submit" class="btn primary">Login</button>
          </form>
          <div class="auth-links">
            <a href="forgot-password.html">Forgot Password?</a>
            <p>Don't have a business account? <a href="business-signup.html">Sign Up</a></p>
            <p>Not a business? <a href="login.html">User Login</a></p>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>&copy; 2025 Treeplace.app All rights reserved.</p>
      </div>
    </footer>
    <script src="business-login.js"></script>
  </body>

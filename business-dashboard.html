<!doctype html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4704544852112670"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Dashboard - TreePlace.App</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <h1><a href="index.html">TreePlace.App</a></h1>
        <nav>
          <ul>
            <li>
              <a href="#" id="username-link"
                >Welcome, <span id="business-name"></span
              ></a>
            </li>
            <li><a href="#" id="logout-button">Logout</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container" style="padding-top: 2rem; padding-bottom: 2rem">
      <h2 style="margin-top: 4rem">Business Dashboard</h2>

      <section id="dashboard-stats" class="dashboard-stats features-grid">
        <!-- Stats will be populated by JavaScript -->
      </section>

      <section id="locations" style="margin-top: 2rem">
        <h3>Next Upcoming Planting Event</h3>
        <div class="locations-grid features-grid">
          <!-- Locations will be populated by JavaScript -->
        </div>
      </section>

      <section id="sponsorship-management" style="margin-top: 2rem">
        <h3>Sponsorship Management</h3>
        <div class="features-grid">
          <div class="feature-card">
            <h4>Edit Sponsorship Details</h4>
            <form id="sponsorship-form">
              <label for="sponsor-name">Sponsor Name</label>
              <input type="text" id="sponsor-name" name="sponsor-name" required>
              <label for="sponsor-description">Sponsor Description</label>
              <textarea id="sponsor-description" name="sponsor-description" rows="4" required></textarea>
              <label for="sponsor-logo">Sponsor Logo URL</label>
              <input type="url" id="sponsor-logo" name="sponsor-logo">
              <button type="submit" class="btn primary">Save Changes</button>
            </form>
          </div>
          <div class="feature-card">
            <h4>Sponsorship Tier</h4>
            <p>Your current tier: <span id="current-tier">Bronze</span></p>
            <button id="upgrade-tier" class="btn primary">Upgrade Tier</button>
          </div>
          <div class="feature-card">
            <h4>Contact Admin</h4>
            <p>Have questions or need help with your sponsorship?</p>
            <button id="contact-admin" class="btn secondary">Contact Admin</button>
          </div>
        </div>
      </section>
    </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 TreePlace.App. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="business-dashboard.js"></script>
</body>
</html>
